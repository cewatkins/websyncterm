# Sample nginx configuration for WebSyncTERM.
#
# Terminates TLS, serves the static embed bundle and proxies the WebSocket
# upgrade to the gateway.

server {
    listen 443 ssl http2;
    server_name bbs.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The embed widget and the web app.
    root /srv/websyncterm;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The gateway's WebSocket endpoint.
    location /ws {
        proxy_pass http://127.0.0.1:8023/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:8023/health;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8023/api/;
    }
}

server {
    listen 80;
    server_name bbs.example.com;
    return 301 https://$host$request_uri;
}
